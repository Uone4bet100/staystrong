<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stay STRONG</title>
<style>
:root{--sky:#3B9BFF;--navy:#050B2A;--gold:#FFB020;--cream:#F4F8FF;--flagR:#A51931;--flagB:#2D2A4A;
--cut:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);
--th:"Noto Sans Thai","Leelawadee UI","Thonburi",Tahoma,sans-serif;--en:Impact,"Arial Black",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:var(--th);font-size:16px;color:var(--cream);background:var(--navy);overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 18% 8%,#fff 0,rgba(255,255,255,.9) 3%,rgba(255,240,190,.5) 9%,transparent 28%),linear-gradient(180deg,#1a6fe0 0%,#3B9BFF 45%,#9ed3ff 72%,#050B2A 73%)}
#bg svg{position:absolute;left:0;bottom:0;width:100%;height:60%}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;filter:blur(2px)}
.tree{position:absolute;bottom:26%;width:14vw;max-width:150px;height:30vh;background:radial-gradient(circle at 50% 35%,#1f9d55 0,#0d5f33 60%,transparent 62%);opacity:.9}
.tree.l{left:-3vw}.tree.r{right:-3vw}
#flag{position:fixed;right:8px;top:8px;width:clamp(70px,16vw,150px);z-index:1;transform-origin:left center;animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewY(-3deg) scaleX(1)}to{transform:skewY(3deg) scaleX(.94)}}
#app{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:16px 14px 40px}
.sk{display:inline-block;transform:skewX(-8deg);font-weight:800}
/* โลโก้ */
.hero{text-align:center;padding-top:20px}
.logo{display:inline-block;transform:skewX(-8deg) rotate(-2deg);line-height:.95;animation:slam .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:skewX(-8deg) rotate(-2deg) scale(2.4);opacity:0}to{transform:skewX(-8deg) rotate(-2deg) scale(1);opacity:1}}
.stay{display:block;text-align:left;font:italic 900 clamp(34px,9vw,64px) var(--en);color:#fff;-webkit-text-stroke:.1em #1d5fe0;paint-order:stroke fill;text-shadow:0 0 16px #3B9BFF;margin-left:4%}
.strong{position:relative;display:inline-block;font:900 clamp(60px,18vw,132px) var(--en);letter-spacing:.02em}
.lay{display:block;white-space:nowrap}
.back{color:var(--navy);-webkit-text-stroke:.13em var(--navy);paint-order:stroke fill;text-shadow:0 .07em 0 #000,0 .12em .12em rgba(0,0,0,.6)}
.front{position:absolute;left:0;top:0;background:linear-gradient(180deg,#FFF27A 0,#FFB020 45%,#FF6A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;overflow:hidden}
.front::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);animation:shine 3.2s 1s infinite;-webkit-text-fill-color:initial}
@keyframes shine{to{left:130%}}
.o{position:relative;display:inline-block;font-style:normal}
.ban{position:absolute;left:50%;top:50%;width:1.05em;height:1.05em;transform:translate(-50%,-48%);-webkit-text-fill-color:initial}
.crown{position:absolute;left:50%;top:-.42em;width:.6em;transform:translateX(-50%);-webkit-text-fill-color:initial}
.banner{display:inline-block;margin:14px auto 6px;padding:10px 34px;font-weight:800;font-size:clamp(16px,3.6vw,24px);background:linear-gradient(180deg,#0b1f6e,#06104a);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);filter:drop-shadow(0 0 8px #4FC3FF);box-shadow:inset 0 0 0 2px #4FC3FF;text-shadow:0 0 8px #4FC3FF}
.tag{font-weight:800;font-size:clamp(15px,3vw,20px);text-shadow:0 2px 6px #000;margin-top:6px}
.tag span{color:var(--gold)}
/* ปุ่ม */
.btn{font:800 17px var(--th);min-height:46px;padding:0 26px;border:0;color:#fff;cursor:pointer;background:linear-gradient(180deg,var(--b1,#FFB020),var(--b2,#FF6A00));clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);filter:drop-shadow(0 0 8px var(--b2,#FF6A00));transition:transform .1s;text-shadow:0 1px 3px rgba(0,0,0,.5);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:scale(.94) translateY(2px)}
.btn.sec{--b1:#3B9BFF;--b2:#1d5fe0}.btn.gr{--b1:#555d7a;--b2:#2a3050}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0}
/* การ์ด */
.grid{display:grid;grid-template-columns:1fr;gap:22px;margin-top:18px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.cw{filter:drop-shadow(0 0 10px var(--g));animation:cardin .6s both;animation-delay:calc(var(--i)*.15s + .6s)}
@keyframes cardin{from{opacity:0;transform:translateY(20px) scale(.95);filter:brightness(.3)}}
.c{clip-path:var(--cut);background:linear-gradient(135deg,var(--g),var(--m));padding:3px;height:100%}
.ci{clip-path:var(--cut);height:100%;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;
background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 22px),linear-gradient(160deg,var(--d),#050B2A 90%);box-shadow:inset 0 0 0 3px var(--d),inset 0 0 0 4px var(--g)}
.ch{display:flex;align-items:center;gap:12px}
.hex{width:62px;height:70px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--g),var(--m));display:grid;place-items:center;font:italic 900 40px var(--en);color:#fff;text-shadow:0 2px 0 var(--d)}
.hex.big{width:120px;height:136px;font-size:78px}
.en{font:italic 800 20px var(--en);color:var(--g);letter-spacing:.03em}
.th{font-weight:800;font-size:22px;color:#fff;transform:skewX(-8deg);display:inline-block}
.art{position:relative;height:190px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 70%,var(--m),var(--d));border:2px solid var(--g);display:grid;place-items:center}
.art svg.chr{height:100%;position:relative;z-index:1}
.art img{width:100%;height:100%;object-fit:cover}
.chip{position:absolute;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);border:2px solid var(--g);box-shadow:0 0 12px var(--g);animation:pulse 2.6s ease-in-out infinite}
.chip svg{width:20px;height:20px}
@keyframes pulse{50%{box-shadow:0 0 22px var(--g);transform:scale(1.07)}}
.quote{font-weight:700;font-size:16px;text-align:center;line-height:1.5}
.pan{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--g);border-radius:12px;padding:8px 10px;font-size:15px}
.pan b{font-size:20px;color:var(--g);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pan svg{width:22px;height:22px}
.foot{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(0,0,0,.45),var(--d));border:1px solid var(--g);font-weight:700;font-size:15px}
.foot svg{width:24px;height:24px;color:var(--g);flex:none}
.foot.open svg{animation:keyopen .9s both}
@keyframes keyopen{0%{transform:rotate(-30deg) scale(.5)}60%{transform:rotate(15deg) scale(1.4);filter:drop-shadow(0 0 12px #fff)}100%{transform:none}}
.gtrophy{color:#6b6f86}.gtrophy.on{color:var(--gold)}.gtrophy.on svg{filter:drop-shadow(0 0 6px var(--gold))}
.locked .art,.locked .quote,.locked .hex{filter:grayscale(.9) brightness(.55)}
.locked .cw,.cw.locked{filter:drop-shadow(0 0 3px #555)}
.lk{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(5,11,42,.45);text-align:center;font-weight:800;padding:20px;pointer-events:none}
.lk svg{width:54px;height:54px}
.cw.play .c{animation:glowb 2.4s ease-in-out infinite}
@keyframes glowb{50%{filter:brightness(1.35)}}
.done{position:absolute;top:10px;right:10px;z-index:2;display:flex;align-items:center;gap:6px;background:#12b76a;color:#fff;font-weight:800;font-size:14px;padding:4px 10px;border-radius:20px;box-shadow:0 0 10px #12b76a}
.done svg{width:16px;height:16px}
.sc{font-weight:800;color:#7CFFB0;text-align:center}
/* กติกา */
.rules{margin:26px auto 0;max-width:760px;padding:18px 22px;background:rgba(5,11,42,.82);border:2px solid #4FC3FF;clip-path:var(--cut);box-shadow:inset 0 0 18px rgba(79,195,255,.3)}
.rules h2{color:var(--gold);margin-bottom:6px;font-size:22px}
.rules li{margin:6px 0 6px 22px;line-height:1.6}
.slog{text-align:center;margin-top:26px;font-weight:800;font-size:clamp(17px,3.4vw,24px);text-shadow:0 2px 8px #000}
.ribbon{height:10px;margin:14px auto 0;max-width:340px;background:linear-gradient(90deg,var(--flagR) 0 20%,#fff 20% 40%,var(--flagB) 40% 60%,#fff 60% 80%,var(--flagR) 80%);border-radius:6px}
/* หน้าอื่น */
.panel{max-width:720px;margin:20px auto;padding:22px;background:rgba(5,11,42,.88);clip-path:var(--cut);border:0;box-shadow:inset 0 0 0 2px var(--g),inset 0 0 22px var(--m);text-align:center}
.panel.wrap{filter:drop-shadow(0 0 12px var(--g))}
.panel .art{height:260px;margin:14px 0}
.hd{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px 0}
.prog i{height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
.prog i.ok{background:#2ECC71;box-shadow:0 0 6px #2ECC71}.prog i.no{background:#FF3B4E}.prog i.cur{background:var(--g);animation:pulse 1.4s infinite}
.qt{font-weight:800;font-size:clamp(18px,3.6vw,23px);line-height:1.5;text-align:left;margin:14px 0}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:700 17px/1.4 var(--th);color:#fff;min-height:54px;padding:8px 14px;cursor:pointer;background:rgba(255,255,255,.06);border:2px solid var(--g);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.15s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.14)}
.opt .hx{width:34px;height:38px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(var(--g),var(--m));display:grid;place-items:center;font-weight:800}
.opt:disabled{cursor:default}
.opt.right{border-color:#2ECC71;background:rgba(46,204,113,.25);box-shadow:0 0 16px #2ECC71}
.opt.wrong{border-color:#FF3B4E;background:rgba(255,59,78,.25);box-shadow:0 0 16px #FF3B4E;animation:shake .4s}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.exp{margin-top:14px;padding:12px 14px;text-align:left;border-radius:12px;line-height:1.6;animation:up .35s both;border-left:6px solid}
.exp.ok{background:rgba(46,204,113,.18);border-color:#2ECC71}.exp.bad{background:rgba(255,59,78,.18);border-color:#FF3B4E}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.big{font:900 clamp(48px,12vw,84px) var(--en);color:var(--gold);text-shadow:0 0 18px var(--gold)}
.rv{text-align:left;margin-top:12px;display:grid;gap:10px}
.rv div{padding:10px 12px;background:rgba(255,255,255,.07);border-radius:10px;line-height:1.6;font-size:16px}
.rv small{color:#FF9aa5;display:block}.rv em{color:#7CFFB0;font-style:normal;display:block}
.trophy{width:min(240px,60vw);margin:10px auto;animation:bounce 1.2s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 24px var(--gold))}
@keyframes bounce{from{transform:scale(0) rotate(-20deg)}}
.rays{position:relative}.rays::before{content:"";position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px;background:repeating-conic-gradient(rgba(255,214,90,.35) 0 8deg,transparent 8deg 20deg);border-radius:50%;animation:spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.sum div{padding:8px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:800}
.mod{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.mod .panel{margin:0;background:#0a1240}
#cf{position:fixed;inset:0;z-index:30;pointer-events:none}
.snd{position:fixed;left:10px;bottom:10px;z-index:15;min-height:44px;min-width:44px;border-radius:50%;border:2px solid #4FC3FF;background:rgba(5,11,42,.85);color:#fff;cursor:pointer;display:grid;place-items:center}
.snd svg{width:22px;height:22px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true">
 <div class="cloud" style="left:8%;top:14%;width:150px;height:44px"></div>
 <div class="cloud" style="left:55%;top:24%;width:200px;height:54px"></div>
 <div class="tree l"></div><div class="tree r"></div>
 <svg id="sky1" viewBox="0 0 1200 400" preserveAspectRatio="none"></svg>
</div>
<svg id="flag" viewBox="0 0 120 84" aria-hidden="true"><rect x="0" y="0" width="120" height="14" fill="#A51931"/><rect y="14" width="120" height="14" fill="#F4F8FF"/><rect y="28" width="120" height="28" fill="#2D2A4A"/><rect y="56" width="120" height="14" fill="#F4F8FF"/><rect y="70" width="120" height="14" fill="#A51931"/></svg>
<canvas id="cf" aria-hidden="true"></canvas>
<main id="app"></main>
<button class="snd" id="snd" aria-label="เปิดหรือปิดเสียง"></button>
<script>
/* ================= DATA ================= */
// ใส่ URL หรือ data URI เพื่อแทนภาพ SVG ที่วาดเอง
const ASSETS = { hero:"", S:"", T:"", R:"", O:"", N:"", G:"" };

// ตัวช่วยสร้างข้อสอบ: Q(โจทย์, ถูก, ผิด1, ผิด2, ผิด3, เฉลย) กระจายตำแหน่งคำตอบถูกให้เท่า ๆ กัน
const POS=[2,0,3,1,0,2,1,3,1,0];
function mk(off,arr){return arr.map((r,i)=>{const p=POS[(i+off)%10],w=r.slice(2,5),ch=[];let k=0;for(let j=0;j<4;j++)ch.push(j===p?r[1]:w[k++]);return{q:r[0],choices:ch,answer:p,explain:r[5]}})}
const QUESTIONS = {
S: mk(0,[
["ค่าขนมเหลือเดือนละ 300 บาท ทำอย่างไรจึงสอดคล้องความพอเพียง?","แบ่งออมส่วนหนึ่ง ใช้เท่าที่จำเป็น","ใช้หมดก่อนแล้วค่อยขอเพิ่ม","ยืมเพื่อนซื้อของตามเทรนด์","ซื้อทุกอย่างที่ลดราคา","การรู้จักประมาณตนและออมไว้ คือหัวใจของความพอเพียง"],
["สามห่วงของเศรษฐกิจพอเพียงคือข้อใด?","พอประมาณ มีเหตุผล มีภูมิคุ้มกัน","ประหยัด อดทน สะสม","รวดเร็ว แข่งขัน ร่ำรวย","เก็บเงิน ลงทุน เสี่ยง","สามห่วงคือ พอประมาณ มีเหตุผล และมีภูมิคุ้มกันที่ดี"],
["สองเงื่อนไขของเศรษฐกิจพอเพียงคือข้อใด?","ความรู้ และคุณธรรม","เงินทุน และเส้นสาย","ชื่อเสียง และอำนาจ","ความเร็ว และโชค","ต้องใช้ความรู้คู่กับคุณธรรมในการตัดสินใจ"],
["ความโลภที่ไม่รู้จักพอมักนำไปสู่อะไร?","ยอมโกงเพื่อให้ได้เกินความจำเป็น","การออมที่มากขึ้น","ความสุขที่ยั่งยืน","การแบ่งปันมากขึ้น","ความอยากได้ไม่สิ้นสุดทำให้คนยอมทำผิดได้"],
["อยากได้เกมใหม่แต่เงินไม่พอ เพื่อนชวนหยิบเงินกองกลางไปก่อน ควรทำอย่างไร?","ปฏิเสธ แล้วเก็บเงินของตัวเอง","ยืมไปก่อนแล้วค่อยคืน","หยิบเฉพาะวันนี้วันเดียว","บอกให้เพื่อนหยิบแทน","เงินกองกลางไม่ใช่ของส่วนตัว การหยิบไปคือการโกง"],
["“ภูมิคุ้มกัน” ในชีวิตนักเรียนหมายถึงข้อใด?","มีเงินออมและแผนรับมือเหตุไม่คาดฝัน","ซื้อประกันทุกประเภท","ไม่ยุ่งกับใคร","ใช้เงินให้หมดทุกเดือน","การเตรียมพร้อมช่วยให้ไม่ต้องหาทางลัดเมื่อเดือดร้อน"],
["ข้อใดไม่ใช่การพอประมาณ?","เป็นหนี้เพื่อซื้อของอวดเพื่อน","ซื้อของตามความจำเป็น","จดรายจ่ายประจำวัน","เลือกใช้ของที่มีอยู่ก่อน","การเป็นหนี้เพื่ออวดเกินกำลังไม่ใช่ความพอประมาณ"],
["การจดบัญชีรายรับรายจ่ายช่วยเรื่องใดได้ดีที่สุด?","เห็นว่าใช้เกินตัวตรงไหนและปรับได้","ทำให้เงินเพิ่มเอง","ทำให้ไม่ต้องออม","ทำให้ซื้อของได้ไม่จำกัด","ข้อมูลที่จดไว้ช่วยวางแผนและลดการใช้เกินตัว"],
["ทำไมการออมสม่ำเสมอจึงช่วยลดแรงจูงใจทุจริต?","มีเงินสำรองจึงไม่ต้องหาทางลัดยามเดือดร้อน","เพราะทำให้รวยเร็ว","เพราะไม่ต้องทำงาน","เพราะไม่มีใครรู้","เงินสำรองลดแรงกดดันที่อาจผลักให้ทำผิด"],

 <div class="row"><button class="btn" style="--b1:${s.g};--b2:${s.m}" onclick="start(${i})">เริ่มด่าน</button><button class="btn gr" onclick="home()">กลับหน้าแรก</button></div></div>`;window.scrollTo(0,0)}
function start(i){
 const list=shuffle(QUESTIONS[ST[i].k]).map(q=>{const idx=shuffle([0,1,2,3]);return{q:q.q,c:idx.map(k=>q.choices[k]),a:idx.indexOf(q.answer),e:q.explain}});
 run={s:i,list,i:0,score:0,picked:null,res:[],wrong:[]};quiz()}
function quiz(){
 view="quiz";const s=ST[run.s],q=run.list[run.i],pk=run.picked;
 const prog=run.list.map((_,k)=>`<i class="${k<run.res.length?(run.res[k]?"ok":"no"):k===run.i?"cur":""}"></i>`).join("");
 const opts=q.c.map((t,k)=>{let c="opt";if(pk!==null){if(k===q.a)c+=" right";else if(k===pk)c+=" wrong";else c+=" dim"}
  return `<button class="${c}" ${pk!==null?"disabled":""} onclick="pick(${k})" aria-label="ตัวเลือก ${NAMES[k]} ${t}"><span class="hx">${NAMES[k]}</span><span>${t}</span>${pk!==null&&k===q.a?ic("check").replace("<svg","<svg style='width:24px;margin-left:auto;color:#2ECC71'"):""}</button>`}).join("");
 const ex=pk!==null?`<div class="exp ${pk===q.a?"ok":"bad"}" role="status"><b>${pk===q.a?"ถูกต้อง!":"ยังไม่ถูก"}</b> ${q.e}</div><div class="row"><button class="btn" style="--b1:${s.g};--b2:${s.m}" onclick="nextQ()">${run.i===9?"ดูผลคะแนน":"ข้อถัดไป"}</button></div>`:"";
 app.innerHTML=`<div class="panel wrap" style="${sv(s)};filter:drop-shadow(0 0 12px ${s.g})"><div class="hd"><div class="ch"><div class="hex" style="width:44px;height:50px;font-size:28px">${s.k}</div><b class="sk">${s.th}</b></div><b>ข้อ ${run.i+1}/10</b><b style="color:#7CFFB0">คะแนน ${run.score}</b></div>
 <div class="prog" aria-hidden="true">${prog}</div><p class="qt">${q.q}</p><div class="opts">${opts}</div>${ex}</div>`;
 if(pk!==null)app.querySelector(".exp").scrollIntoView({block:"nearest",behavior:"smooth"})}
function pick(k){if(run.picked!==null)return;const q=run.list[run.i];run.picked=k;const ok=k===q.a;run.res.push(ok);if(ok){run.score++;beep([660,880])}else{run.wrong.push({q:q.q,mine:q.c[k],right:q.c[q.a],e:q.e});beep([200,150])}quiz()}
function nextQ(){run.picked=null;run.i++;if(run.i<10)return quiz();finish()}
function finish(){
 const s=run.s,sc=run.score,ok=sc>=8,was=passed(s);
 if(state.best[s]===null||sc>state.best[s])state.best[s]=sc;save();
 if(ok&&!was&&s<5)justOpened=s;
 if(ok&&s===5)return win(true);
 view="result";const t=ST[s];
 const rv=run.wrong.length?`<h3 style="margin-top:18px">ทบทวนข้อที่ตอบผิด</h3><div class="rv">${run.wrong.map(w=>`<div>${w.q}<small>คุณตอบ: ${w.mine}</small><em>เฉลย: ${w.right}</em>${w.e}</div>`).join("")}</div>`:"";
 app.innerHTML=`<div class="panel wrap" style="${sv(t)};filter:drop-shadow(0 0 14px ${ok?"#2ECC71":"#FF3B4E"})"><div class="big">${sc}/10</div><p style="font-size:22px;font-weight:800">${sc*10}%</p>
 <p class="${ok?"sc":""}" style="font-size:20px;font-weight:800;margin:10px 0;color:${ok?"#7CFFB0":"#FF9aa5"}">${ok?"ผ่านด่านแล้ว! ปลดล็อกด่านถัดไป":"ยังไม่ถึงเกณฑ์ 80% ต้องกลับมาเล่นด่านเดิมใหม่"}</p>
 <div class="row">${ok?`<button class="btn" onclick="intro(${s+1})">ไปด่านถัดไป</button>`:`<button class="btn" onclick="start(${s})">เล่นด่านนี้ใหม่</button>`}<button class="btn gr" onclick="home()">กลับหน้าแรก</button></div>${rv}</div>`;
 if(ok){confetti(120);beep([523,659,784,1047])}window.scrollTo(0,0)}
function win(fresh){
 view="win";
 app.innerHTML=`<div class="panel wrap" style="--g:#FFB020;--m:#FF6A00;filter:drop-shadow(0 0 18px #FFB020)"><div class="rays"><svg class="trophy" viewBox="0 0 120 130" role="img" aria-label="ถ้วยรางวัลทอง"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF27A"/><stop offset=".5" stop-color="#FFB020"/><stop offset="1" stop-color="#C46A00"/></linearGradient></defs><path d="M30 10h60v34a30 30 0 01-60 0z" fill="url(#gg)" stroke="#7a4300" stroke-width="3"/><path d="M30 18H10c0 20 8 30 22 32M90 18h20c0 20-8 30-22 32" fill="none" stroke="#FFB020" stroke-width="7"/><path d="M52 72h16v22H52z" fill="url(#gg)" stroke="#7a4300" stroke-width="3"/><path d="M34 94h52l6 22H28z" fill="url(#gg)" stroke="#7a4300" stroke-width="3"/><path d="M60 22l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#fff" opacity=".9"/></svg></div>
 <h2 class="sk" style="font-size:clamp(24px,6vw,36px);color:#FFE27A;text-shadow:0 0 14px #FFB020">คุณคือพลเมืองดีที่ต่อต้านการทุจริต</h2>
 <div class="sum">${ST.map((s,i)=>`<div style="border:2px solid ${s.g};color:${s.g}">${s.k} ${s.th}<br><span style="color:#fff">${state.best[i]===null?"-":state.best[i]}/10</span></div>`).join("")}</div>
 <p class="sk" style="font-size:22px">หยุดทุจริต เริ่มที่ตัวเรา</p>
 <div class="row"><button class="btn" onclick="askReset()">เล่นใหม่ทั้งหมด</button><button class="btn sec" onclick="home()">กลับหน้าแรก</button></div></div>`;
 if(fresh!==false){confetti(220);setTimeout(()=>confetti(160),700);beep([523,659,784,1047,1319])}window.scrollTo(0,0)}
function askReset(){
 const m=document.createElement("div");m.className="mod";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
 m.innerHTML=`<div class="panel" style="--g:#FF7A7A;--m:#FF3B4E"><h2>เริ่มใหม่ทั้งหมด?</h2><p style="margin:10px 0">ความคืบหน้าและคะแนนทุกด่านจะถูกลบ</p><div class="row"><button class="btn" id="yes" style="--b1:#FF7A7A;--b2:#FF3B4E">ยืนยัน ลบทั้งหมด</button><button class="btn gr" id="no">ยกเลิก</button></div></div>`;
 document.body.appendChild(m);m.querySelector("#no").focus();
 m.querySelector("#no").onclick=()=>m.remove();
 m.querySelector("#yes").onclick=()=>{state={best:[null,null,null,null,null,null]};save();m.remove();home()};
 m.onkeydown=e=>{if(e.key==="Escape")m.remove()}}
/* ================= EFFECTS ================= */
function sky(){// ซิลูเอทตึกระฟ้า 3 ชั้น
 let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;let h="";
 [[.35,"#6fa8e8",300],[.55,"#2d5aa8",230],[.8,"#0a1a5c",160]].forEach(([o,c,mx])=>{let x=0;h+=`<g fill="${c}" opacity="${o+.2}">`;while(x<1200){const w=30+rnd()*50,ht=60+rnd()*(mx-60);h+=`<rect x="${x}" y="${400-ht}" width="${w}" height="${ht}"/>`;if(rnd()>.7)h+=`<rect x="${x+w/2-2}" y="${400-ht-30}" width="4" height="30"/>`;x+=w+4}h+="</g>"});
 document.getElementById("sky1").innerHTML=h}
const cv=document.getElementById("cf"),cx=cv.getContext("2d");let ps=[],raf=0;
function confetti(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;cv.width=innerWidth;cv.height=innerHeight;
 const cols=["#FFB020","#FF3B4E","#2F8CFF","#2ECC71","#9B5CFF","#22D3EE","#fff"];
 for(let i=0;i<n;i++)ps.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,r:Math.random()*6+3,c:cols[i%7],a:Math.random()*6});
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.y<cv.height+20);
 ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
 raf=ps.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
let ac=null;function beep(fs){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*.11;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}}
const sb=document.getElementById("snd");
function sndUI(){sb.innerHTML=ic(soundOn?"sound":"mute");sb.setAttribute("aria-pressed",soundOn)}
sb.onclick=()=>{soundOn=!soundOn;sndUI();beep([660])};
/* ================= INIT ================= */
const app=document.getElementById("app");
sky();sndUI();load();home();
</script>
